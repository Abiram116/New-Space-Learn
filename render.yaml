# Render deploy manifest — one FastAPI web service, free tier.
# Env vars are set from the Render dashboard (mark them "sync: false" so a
# repo push can't accidentally overwrite them).

services:
  - type: web
    name: space-learn-api
    env: python
    plan: free
    rootDir: api
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MODEL_FAST
        value: llama-3.1-8b-instant
      - key: GROQ_MODEL_VISION
        value: qwen/qwen3.6-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      # Embeddings — local (BGE-small-en-v1.5, quantized ONNX), no API key,
      # no second provider account. See
      # docs/decisions.md.
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      # "false" as of 2026-08-09. The vector(1536)->vector(384) migration
      # (supabase/migrations/20260810090000_embedding_dim_384.sql) is applied
      # on the live database, and the pipeline is verified end-to-end against
      # it: a real upload chunked, embedded with the real BGE-small model,
      # inserted, and retrieved with a correct citation. See
      # docs/decisions.md and the chunk_text fix in
      # this same change — a real infinite-loop bug, not a timing issue, was
      # the actual cause of documents hanging at "embedding chunks" before
      # this was verified. document_chunks was empty at the time this flag
      # flipped, so no re-embed was needed; if that's no longer true when you
      # read this, run api/scripts/reembed_documents.py once after deploying.
      - key: USE_STUB_EMBEDDINGS
        value: "false"
      # No endpoint map in production.
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
