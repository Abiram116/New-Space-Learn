# Render deploy manifest — one FastAPI web service, free tier.
# Env vars are set from the Render dashboard (mark them "sync: false" so a
# repo push can't accidentally overwrite them).

services:
  - type: web
    name: space-learn-api
    env: python
    plan: free
    rootDir: api
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MODEL_FAST
        value: llama-3.1-8b-instant
      - key: GROQ_MODEL_VISION
        value: qwen/qwen3.6-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      # Embeddings — the one second provider (Groq hosts no embedding model).
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        value: https://api.openai.com/v1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      # Still "true" because no EMBEDDING_API_KEY is provisioned yet. Under the
      # stub, retrieval is NOT semantically meaningful — see docs/AI_ENGINE.md
      # §4. To go live: set EMBEDDING_API_KEY in the Render dashboard, flip
      # this to "false", redeploy, then run scripts/reembed_documents.py once.
      # Setting the flag without the key logs a warning and keeps the stub,
      # rather than failing every upload.
      - key: USE_STUB_EMBEDDINGS
        value: "true"
      # No endpoint map in production.
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
