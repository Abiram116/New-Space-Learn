# Render deploy manifest — one FastAPI web service, free tier.
# Env vars are set from the Render dashboard (mark them "sync: false" so a
# repo push can't accidentally overwrite them).

services:
  - type: web
    name: space-learn-api
    env: python
    plan: free
    rootDir: api
    # The prefetch bakes the embedding model into the built image — measured
    # 28.5s to fetch cold vs 0.4s to load from disk. Without it, every cold
    # start re-downloads it (the container's disk does not survive a
    # spin-down). It also runs one real inference, so a bad download fails the
    # BUILD rather than the first student's upload.
    #
    # --compile-bytecode + compileall: Render's disk is wiped on every
    # spin-down, so without these every cold start recompiles every imported
    # module from source — measured ~1.1 CPU-seconds saved on a 2s import,
    # i.e. ~10s on 0.1 vCPU. The prefetch also writes the build-time
    # graph-optimised copy of the model that embeddings.py loads (~80MB less
    # resident, no optimiser pass at start).
    buildCommand: pip install uv && uv sync --frozen --compile-bytecode && uv run --no-sync python scripts/prefetch_model.py && uv run --no-sync python -m compileall -q app
    # --no-sync: the build already installed everything. Plain `uv run` re-checks
    # and rebuilds the project on EVERY start (measured ~6s in the first deploy),
    # and a cold start is the worst latency in the product.
    # --ws none: nothing here speaks WebSocket, so don't import the library.
    # uvloop and httptools are picked automatically when installed (they are,
    # via uvicorn[standard]).
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --ws none
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Both retired by Groq (confirmed 2026-09-21 against the live API, not
      # docs); these override config.py's defaults, so leaving the old ids
      # here would break the home brief and image chat on deploy even though
      # the code itself was already fixed.
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: GROQ_MODEL_VISION
        value: qwen/qwen3.8-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      # Embeddings — local (BGE-small-en-v1.5, quantized ONNX), no API key,
      # no second provider account. See
      # docs/decisions.md.
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      # Relative to rootDir (api/), which is the CWD for both build and start
      # — so the path the build writes to is the path runtime reads from.
      - key: EMBEDDING_CACHE_DIR
        value: .cache/fastembed
      # 0.1 vCPU. ONNX Runtime would otherwise size its pool to the HOST's
      # visible cores and thrash them against a sliver of one.
      - key: EMBEDDING_THREADS
        value: "1"
      # "false" as of 2026-08-09. The vector(1536)->vector(384) migration
      # (supabase/migrations/20260810090000_embedding_dim_384.sql) is applied
      # on the live database, and the pipeline is verified end-to-end against
      # it: a real upload chunked, embedded with the real BGE-small model,
      # inserted, and retrieved with a correct citation. See
      # docs/decisions.md and the chunk_text fix in
      # this same change — a real infinite-loop bug, not a timing issue, was
      # the actual cause of documents hanging at "embedding chunks" before
      # this was verified. document_chunks was empty at the time this flag
      # flipped, so no re-embed was needed; if that's no longer true when you
      # read this, run api/scripts/reembed_documents.py once after deploying.
      - key: USE_STUB_EMBEDDINGS
        value: "false"
      # No endpoint map in production.
      - key: EXPOSE_API_DOCS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      # A hash, never the password: `uv run python -m app.services.admin_gate`.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: LOG_LEVEL
        value: info
