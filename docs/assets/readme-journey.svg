<svg width="1200" height="190" viewBox="0 0 1200 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="j-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#131f38"/><stop offset="100%" stop-color="#0e2f34"/></linearGradient>
    <linearGradient id="j-brand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a120f"/><stop offset="100%" stop-color="#241713"/></linearGradient>
    <linearGradient id="j-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#241a08"/><stop offset="100%" stop-color="#34260c"/></linearGradient>
    <linearGradient id="j-mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#18220a"/><stop offset="100%" stop-color="#22320f"/></linearGradient>
    <linearGradient id="j-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#250c18"/><stop offset="100%" stop-color="#351122"/></linearGradient>
    <marker id="j-feedback-arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7aa8ff" opacity="0.85"/>
    </marker>
  </defs>

  <rect width="1200" height="190" fill="#1e1a17"/>
  <text x="20" y="20" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" fill="#9c8b80">ONE ARTIFACT, FOLLOWED THROUGH THE LOOP</text>

  <!-- 5 primary artifact stages + 4 connecting arrows -->
  <g font-family="'Courier New', monospace">
    <!-- MATERIAL -->
    <rect x="14" y="34" width="216" height="94" rx="8" fill="url(#j-sky)" stroke="#35d6e8" stroke-width="1.6"/>
    <text x="30" y="58" font-size="12" font-weight="700" fill="#92eaf4">MATERIAL</text>
    <text x="30" y="76" font-size="10" fill="#a89484">A lecture PDF</text>
    <text x="30" y="90" font-size="10" fill="#a89484">on the topic.</text>

    <polygon points="236,81 248,75 236,69" fill="#5c4c3e"/>

    <!-- CHAT -->
    <rect x="252" y="34" width="216" height="94" rx="8" fill="url(#j-brand)" stroke="#ff5a3c" stroke-width="1.6"/>
    <text x="268" y="58" font-size="12" font-weight="700" fill="#ffb3a0">CHAT</text>
    <text x="268" y="76" font-size="10" fill="#a89484">Ask about it —</text>
    <text x="268" y="90" font-size="10" fill="#a89484">grounded, cited answer.</text>

    <polygon points="474,81 486,75 474,69" fill="#5c4c3e"/>

    <!-- NOTE -->
    <rect x="490" y="34" width="216" height="94" rx="8" fill="url(#j-sun)" stroke="#ffc53d" stroke-width="1.6"/>
    <text x="506" y="58" font-size="12" font-weight="700" fill="#ffdd8f">NOTE</text>
    <text x="506" y="76" font-size="10" fill="#a89484">Saved in one click,</text>
    <text x="506" y="90" font-size="10" fill="#a89484">AI-marked, editable.</text>

    <polygon points="712,81 724,75 712,69" fill="#5c4c3e"/>

    <!-- CARDS -->
    <rect x="728" y="34" width="216" height="94" rx="8" fill="url(#j-mint)" stroke="#b8ff3c" stroke-width="1.6"/>
    <text x="744" y="58" font-size="12" font-weight="700" fill="#d8ff92">CARDS</text>
    <text x="744" y="76" font-size="10" fill="#a89484">Generated from</text>
    <text x="744" y="90" font-size="10" fill="#a89484">the note, SM-2 spaced.</text>

    <polygon points="950,81 962,75 950,69" fill="#5c4c3e"/>

    <!-- QUIZ -->
    <rect x="966" y="34" width="220" height="94" rx="8" fill="url(#j-coral)" stroke="#ff3d8b" stroke-width="1.6"/>
    <text x="982" y="58" font-size="12" font-weight="700" fill="#ff9ac1">QUIZ</text>
    <text x="982" y="76" font-size="10" fill="#a89484">Auto-graded,</text>
    <text x="982" y="90" font-size="10" fill="#a89484">tagged by concept.</text>
  </g>

  <!-- Student Model — feedback layer, not a 6th artifact: smaller, separate row, pill treatment matching the study-loop's hub -->
  <path d="M 1076,128 Q 905,148 738,152" fill="none" stroke="#5590ff" stroke-width="1.3" stroke-dasharray="1 4" opacity="0.65" marker-end="url(#j-feedback-arrow)"/>
  <rect x="585" y="152" width="230" height="30" rx="15" fill="#20293b" fill-opacity="0.55" stroke="#5590ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="700" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a6c6ff">STUDENT MODEL</text>
</svg>
