<svg width="1128" height="580" viewBox="64 4 1128 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="node-sky" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0e2f34"/><stop offset="100%" stop-color="#131f38"/>
    </radialGradient>
    <radialGradient id="node-brand" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#241713"/><stop offset="100%" stop-color="#1a120f"/>
    </radialGradient>
    <radialGradient id="node-sun" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#34260c"/><stop offset="100%" stop-color="#241a08"/>
    </radialGradient>
    <radialGradient id="node-mint" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#22320f"/><stop offset="100%" stop-color="#18220a"/>
    </radialGradient>
    <radialGradient id="node-coral" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#351122"/><stop offset="100%" stop-color="#250c18"/>
    </radialGradient>
    <marker id="feedback-arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#7aa8ff" opacity="0.85"/>
    </marker>
  </defs>

  <style>
    .trav{animation:trav 12s linear infinite}
    .ping{opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 12s ease-out infinite}
    .hub{animation:hub 12s ease-in-out infinite}
    .next{animation:nx 12s ease-in-out infinite}
    @keyframes trav{0.00%{transform:translate(620.0px,165.0px)}8.33%{transform:translate(731.7px,201.3px)}16.67%{transform:translate(800.7px,296.3px)}25.00%{transform:translate(800.7px,413.7px)}33.33%{transform:translate(731.7px,508.7px)}41.66%{transform:translate(620.0px,545.0px)}50.00%{transform:translate(508.3px,508.7px)}58.33%{transform:translate(439.3px,413.7px)}66.66%{transform:translate(439.3px,296.3px)}75.00%{transform:translate(508.3px,201.3px)}83.33%{transform:translate(620.0px,165.0px)}100%{transform:translate(620.0px,165.0px)}}
    @keyframes ping{0%{opacity:.6;transform:scale(1)}14%{opacity:0;transform:scale(1.18)}100%{opacity:0;transform:scale(1.18)}}
    @keyframes hub{0%,68%,94%,100%{stroke-opacity:.5;fill-opacity:.55}78%,84%{stroke-opacity:1;fill-opacity:.95}}
    @keyframes nx{0%,76%,100%{fill:#ffcfa0}84%,90%{fill:#fff6ea}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1300" height="660" fill="#1e1a17"/>
 
  <!-- Headline -->
  <text x="628" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="19" letter-spacing="3"
        fill="#f5ede4">ONE STUDY LOOP — FROM MATERIAL TO MASTERY</text>

  <!-- Main track -->
  <circle cx="620" cy="355" r="190" fill="none" stroke="#3b3028" stroke-width="2" stroke-dasharray="2 8"/>

  <!-- Directional arrows around the track — brightened for visibility -->
  <g fill="#8a7663">
    <polygon points="7,0 -5,-5 -5,5" transform="translate(731.7,201.3) rotate(36)"/>
    <polygon points="7,0 -5,-5 -5,5" transform="translate(800.7,413.7) rotate(108)"/>
    <polygon points="7,0 -5,-5 -5,5" transform="translate(620,545) rotate(180)"/>
    <polygon points="7,0 -5,-5 -5,5" transform="translate(439.3,413.7) rotate(252)"/>
  </g>
  <!-- Return arrow PROVE → INGEST, emphasized: brightest + labeled, this is the one that closes the cycle -->
  <g fill="#ffb37a">
    <polygon points="9,0 -6,-6 -6,6" transform="translate(508.3,201.3) rotate(324)"/>
  </g>
  <text x="528" y="170" text-anchor="end" font-family="'Courier New', monospace" font-weight="700" font-size="13" letter-spacing="1.5"
        class="next" fill="#ffcfa0">NEXT CYCLE</text>

  <!-- One document going round the loop -->
  <rect class="trav" x="-5" y="-5" width="10" height="10" fill="#fff6ea" style="transform:translate(620px,165px)"/>

  <!-- Central feedback hub — Student Model. A pill, not a node: no circular
       ring, no stroke-weight competing with the 5 stages, sits inside the
       loop as the feedback layer between PROVE and the next cycle. -->
  <rect class="hub" x="500" y="318" width="240" height="74" rx="18" fill="#20293b" fill-opacity="0.55" stroke="#5590ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="620" y="344" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.5" fill="#a6c6ff">STUDENT MODEL</text>
  <text x="620" y="362" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#a9bde0">Learns from performance.</text>
  <text x="620" y="379" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#a9bde0">Shapes what comes next.</text>

  <!-- Feedback path, made explicit: PROVE → Student Model → next cycle -->
  <g stroke="#5590ff" stroke-width="1.5" stroke-dasharray="1 4" opacity="0.7" fill="none">
    <path d="M 487,311 L 499,323" marker-end="url(#feedback-arrow)"/>
    <path d="M 620,318 L 620,235" marker-end="url(#feedback-arrow)"/>
  </g>

  <!-- ============ INGEST — top ============ -->
  <g>
    <circle cx="620" cy="165" r="46" fill="url(#node-sky)" stroke="#35d6e8" stroke-width="2.5"/>
    <g transform="translate(620,165)" stroke="#92eaf4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0,-13 L0,4 M-6,-5 L0,-13 L6,-5 M-10,10 L10,10"/>
    </g>
    <text x="620" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#92eaf4">INGEST</text>
    <text x="620" y="99" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#c4b5aa">Upload and embed study material.</text>
  </g>

  <!-- ============ INTERROGATE — upper right ============ -->
  <g>
    <circle cx="800.7" cy="296.3" r="46" fill="url(#node-brand)" stroke="#ff5a3c" stroke-width="2.5"/>
    <g transform="translate(800.7,296.3)" stroke="#ffb3a0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-11,-9 L11,-9 L11,6 L-3,6 L-8,12 L-8,6 L-11,6 Z"/>
    </g>
    <text x="868" y="293" text-anchor="start" font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#ffb3a0">INTERROGATE</text>
    <text x="868" y="313" text-anchor="start" font-family="'Courier New', monospace" font-size="13" fill="#c4b5aa">RAG: grounded answers, live citations.</text>
  </g>

  <!-- ============ CONSOLIDATE — lower right ============ -->
  <g>
    <circle cx="731.7" cy="508.7" r="46" fill="url(#node-sun)" stroke="#ffc53d" stroke-width="2.5"/>
    <g transform="translate(731.7,508.7)" stroke="#ffdd8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-9,-12 L4,-12 L9,-7 L9,12 L-9,12 Z M4,-12 L4,-7 L9,-7"/>
      <path d="M-5,-1 L5,-1 M-5,3 L5,3 M-5,7 L2,7" stroke-width="1.5"/>
    </g>
    <text x="799" y="505" text-anchor="start" font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#ffdd8f">CONSOLIDATE</text>
    <text x="799" y="525" text-anchor="start" font-family="'Courier New', monospace" font-size="13" fill="#c4b5aa">Turn answers into editable notes.</text>
  </g>

  <!-- ============ REHEARSE — lower left ============ -->
  <g>
    <circle cx="508.3" cy="508.7" r="46" fill="url(#node-mint)" stroke="#b8ff3c" stroke-width="2.5"/>
    <g transform="translate(508.3,508.7)" stroke="#d8ff92" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-7,-3 A7,7 0 0 1 6,-7"/>
      <polygon points="6,-7 1,-8 3,-3" fill="#d8ff92" stroke="none"/>
      <path d="M7,3 A7,7 0 0 1 -6,7"/>
      <polygon points="-6,7 -1,8 -3,3" fill="#d8ff92" stroke="none"/>
    </g>
    <text x="441" y="505" text-anchor="end" font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#d8ff92">REHEARSE</text>
    <text x="441" y="525" text-anchor="end" font-family="'Courier New', monospace" font-size="13" fill="#c4b5aa">Practice with spaced repetition.</text>
  </g>

  <!-- ============ PROVE — upper left ============ -->
  <g>
    <circle cx="439.3" cy="296.3" r="46" fill="url(#node-coral)" stroke="#ff3d8b" stroke-width="2.5"/>
    <g transform="translate(439.3,296.3)" stroke="#ff9ac1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="-10" y="-10" width="20" height="20" rx="4"/>
      <path d="M-5,0 L-1,5 L6,-6"/>
    </g>
    <text x="372" y="293" text-anchor="end" font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#ff9ac1">PROVE</text>
    <text x="372" y="313" text-anchor="end" font-family="'Courier New', monospace" font-size="13" fill="#c4b5aa">A quiz agent measures understanding.</text>
  </g>
  <!-- Each stage answers as the document arrives -->
  <circle class="ping" cx="620.0" cy="165.0" r="46" fill="none" stroke="#35d6e8" stroke-width="2" style="animation-delay:0s"/>
  <circle class="ping" cx="800.7" cy="296.3" r="46" fill="none" stroke="#ff5a3c" stroke-width="2" style="animation-delay:2s"/>
  <circle class="ping" cx="731.7" cy="508.7" r="46" fill="none" stroke="#ffc53d" stroke-width="2" style="animation-delay:4s"/>
  <circle class="ping" cx="508.3" cy="508.7" r="46" fill="none" stroke="#b8ff3c" stroke-width="2" style="animation-delay:6s"/>
  <circle class="ping" cx="439.3" cy="296.3" r="46" fill="none" stroke="#ff3d8b" stroke-width="2" style="animation-delay:8s"/>
</svg>
