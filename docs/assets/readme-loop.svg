<svg width="1200" height="230" viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="230" fill="#1e1a17"/>

  <!-- Arrows between cards -->
  <g fill="#4a3c32">
    <polygon points="228,100 252,110 228,120"/>
    <polygon points="468,100 492,110 468,120"/>
    <polygon points="708,100 732,110 708,120"/>
    <polygon points="948,100 972,110 948,120"/>
  </g>

  <!-- Card 1 — INGEST -->
  <g>
    <rect x="20" y="20" width="200" height="170" rx="10" fill="#0e2f34" stroke="#35d6e8" stroke-width="2"/>
    <rect x="36" y="36" width="14" height="14" fill="#35d6e8"/>
    <text x="36" y="76" font-family="'Courier New', monospace" font-weight="700" font-size="18" fill="#92eaf4">INGEST</text>
    <text x="36" y="102" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">Upload a PDF or</text>
    <text x="36" y="118" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">text doc — chunked</text>
    <text x="36" y="134" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">and embedded for</text>
    <text x="36" y="150" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">retrieval.</text>
  </g>

  <!-- Card 2 — INTERROGATE -->
  <g>
    <rect x="260" y="20" width="200" height="170" rx="10" fill="#241713" stroke="#ff5a3c" stroke-width="2"/>
    <rect x="276" y="36" width="14" height="14" fill="#ff5a3c"/>
    <text x="276" y="76" font-family="'Courier New', monospace" font-weight="700" font-size="18" fill="#ffb3a0">INTERROGATE</text>
    <text x="276" y="102" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">Chat, grounded in</text>
    <text x="276" y="118" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">the source — cited</text>
    <text x="276" y="134" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">before the first</text>
    <text x="276" y="150" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">token streams in.</text>
  </g>

  <!-- Card 3 — CONSOLIDATE -->
  <g>
    <rect x="500" y="20" width="200" height="170" rx="10" fill="#34260c" stroke="#ffc53d" stroke-width="2"/>
    <rect x="516" y="36" width="14" height="14" fill="#ffc53d"/>
    <text x="516" y="76" font-family="'Courier New', monospace" font-weight="700" font-size="18" fill="#ffdd8f">CONSOLIDATE</text>
    <text x="516" y="102" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">The answer becomes</text>
    <text x="516" y="118" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">a note — LaTeX math</text>
    <text x="516" y="134" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">renders live, AI</text>
    <text x="516" y="150" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">edits stay marked.</text>
  </g>

  <!-- Card 4 — REHEARSE -->
  <g>
    <rect x="740" y="20" width="200" height="170" rx="10" fill="#22320f" stroke="#b8ff3c" stroke-width="2"/>
    <rect x="756" y="36" width="14" height="14" fill="#b8ff3c"/>
    <text x="756" y="76" font-family="'Courier New', monospace" font-weight="700" font-size="18" fill="#d8ff92">REHEARSE</text>
    <text x="756" y="102" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">Flashcards, real</text>
    <text x="756" y="118" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">SM-2 spacing —</text>
    <text x="756" y="134" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">ease, interval and</text>
    <text x="756" y="150" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">reps, done right.</text>
  </g>

  <!-- Card 5 — PROVE -->
  <g>
    <rect x="980" y="20" width="200" height="170" rx="10" fill="#351122" stroke="#ff3d8b" stroke-width="2"/>
    <rect x="996" y="36" width="14" height="14" fill="#ff3d8b"/>
    <text x="996" y="76" font-family="'Courier New', monospace" font-weight="700" font-size="18" fill="#ff9ac1">PROVE</text>
    <text x="996" y="102" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">Auto-generated,</text>
    <text x="996" y="118" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">auto-graded quiz —</text>
    <text x="996" y="134" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">scored, with what</text>
    <text x="996" y="150" font-family="'Courier New', monospace" font-size="11" fill="#d3c5b9">to review next.</text>
  </g>
</svg>
