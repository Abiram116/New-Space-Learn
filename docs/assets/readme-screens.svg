<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#0e2f34"/>
    </linearGradient>
    <linearGradient id="panel-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a08"/>
      <stop offset="100%" stop-color="#34260c"/>
    </linearGradient>
    <linearGradient id="panel-mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18220a"/>
      <stop offset="100%" stop-color="#22320f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#1e1a17"/>
  <text x="40" y="34" font-family="'Courier New', monospace" font-size="12" letter-spacing="2"
        fill="#9c8b80">STYLIZED MOCKUP — NOT A LITERAL SCREENSHOT, SAME DESIGN SYSTEM AS THE REAL APP</text>

  <!-- ===================== Panel 1 — CHAT ===================== -->
  <g>
    <rect x="20" y="56" width="368" height="324" rx="10" fill="url(#panel-sky)" stroke="#35d6e8" stroke-width="2"/>
    <text x="40" y="86" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#92eaf4">CHAT — CITED BEFORE THE ANSWER</text>

    <!-- citation card -->
    <rect x="40" y="100" width="328" height="46" rx="6" fill="#1e1a17" stroke="#3b3028"/>
    <rect x="52" y="112" width="8" height="22" fill="#35d6e8"/>
    <text x="68" y="123" font-family="'Courier New', monospace" font-size="10" fill="#92eaf4">physiology-wk6.pdf · p.31</text>
    <text x="68" y="136" font-family="'Courier New', monospace" font-size="9" fill="#9c8b80">retrieved · 1 of 3</text>

    <!-- streaming answer bubble -->
    <rect x="40" y="158" width="328" height="130" rx="6" fill="#262119" stroke="#3b3028"/>
    <text x="54" y="180" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">Because the two limbs do</text>
    <text x="54" y="197" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">opposite jobs — one sheds</text>
    <text x="54" y="214" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">water, the other pumps out</text>
    <text x="54" y="231" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">salt. Stacked against each</text>
    <text x="54" y="248" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">other, they turn a small</text>
    <text x="54" y="265" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">difference into a steep one.</text>
    <rect x="54" y="273" width="7" height="14" fill="#35d6e8"/>

    <!-- input row -->
    <rect x="40" y="300" width="328" height="32" rx="6" fill="#1e1a17" stroke="#3b3028"/>
    <text x="52" y="320" font-family="'Courier New', monospace" font-size="11" fill="#4a3c32">Ask about this subspace…</text>

    <text x="40" y="356" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" fill="#4a3c32">SSE · TOKEN-BY-TOKEN · CITED FIRST</text>
  </g>

  <!-- ===================== Panel 2 — NOTES ===================== -->
  <g>
    <rect x="416" y="56" width="368" height="324" rx="10" fill="url(#panel-sun)" stroke="#ffc53d" stroke-width="2"/>
    <text x="436" y="86" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#ffdd8f">NOTES — LATEX + AI, MARKED</text>

    <text x="436" y="112" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">Countercurrent Multiplication</text>
    <rect x="436" y="120" width="240" height="1" fill="#3b3028"/>

    <text x="436" y="146" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">The gradient forms because:</text>

    <!-- KaTeX-style rendered math block -->
    <rect x="436" y="158" width="328" height="40" rx="4" fill="#1e1a17" stroke="#3b3028"/>
    <text x="452" y="184" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#ffdd8f">∂L/∂w = 0</text>

    <!-- AI-touched paragraph, visually marked -->
    <rect x="436" y="210" width="4" height="64" fill="#ff5a3c"/>
    <text x="452" y="226" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">Descending: permeable to</text>
    <text x="452" y="242" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">water, not salt. Ascending:</text>
    <text x="452" y="258" font-family="'Courier New', monospace" font-size="11" fill="#e0d3c8">pumps salt out, holds water.</text>
    <text x="452" y="274" font-family="'Courier New', monospace" font-size="9" fill="#ffb3a0">Created by AI · Edited by you</text>

    <!-- selection-action pills -->
    <g font-family="'Courier New', monospace" font-size="9" font-weight="700">
      <rect x="436" y="290" width="78" height="24" rx="5" fill="#1e1a17" stroke="#4a3c32"/>
      <text x="450" y="306" fill="#d3c5b9">REWRITE</text>
      <rect x="522" y="290" width="82" height="24" rx="5" fill="#1e1a17" stroke="#4a3c32"/>
      <text x="536" y="306" fill="#d3c5b9">SIMPLIFY</text>
      <rect x="612" y="290" width="76" height="24" rx="5" fill="#1e1a17" stroke="#4a3c32"/>
      <text x="626" y="306" fill="#d3c5b9">EXPLAIN</text>
    </g>

    <text x="436" y="356" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" fill="#4a3c32">touched_by_agent · touched_by_user</text>
  </g>

  <!-- ===================== Panel 3 — FLASHCARDS ===================== -->
  <g>
    <rect x="812" y="56" width="368" height="324" rx="10" fill="url(#panel-mint)" stroke="#b8ff3c" stroke-width="2"/>
    <text x="832" y="86" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#d8ff92">FLASHCARDS — REAL SM-2 SPACING</text>

    <rect x="832" y="100" width="328" height="150" rx="8" fill="#1e1a17" stroke="#3b3028"/>
    <text x="852" y="128" font-family="'Courier New', monospace" font-size="9" fill="#9c8b80">CARD 2 OF 5 · P.31 · DUE TODAY</text>
    <text x="852" y="156" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">What does the ascending</text>
    <text x="852" y="174" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">limb of the loop do?</text>
    <text x="852" y="210" font-family="'Courier New', monospace" font-size="10" fill="#86e9c9">It pumps salt out and</text>
    <text x="852" y="226" font-family="'Courier New', monospace" font-size="10" fill="#86e9c9">holds water in</text>

    <!-- grade buttons -->
    <g font-family="'Courier New', monospace" font-size="10" font-weight="700">
      <rect x="832" y="264" width="76" height="30" rx="5" fill="#351122" stroke="#ff3d8b"/>
      <text x="850" y="283" fill="#ff9ac1">AGAIN</text>
      <rect x="916" y="264" width="76" height="30" rx="5" fill="#34260c" stroke="#ffc53d"/>
      <text x="937" y="283" fill="#ffdd8f">HARD</text>
      <rect x="1000" y="264" width="76" height="30" rx="5" fill="#0e2f34" stroke="#35d6e8"/>
      <text x="1021" y="283" fill="#92eaf4">GOOD</text>
      <rect x="832" y="302" width="76" height="30" rx="5" fill="#22320f" stroke="#b8ff3c"/>
      <text x="852" y="321" fill="#d8ff92">EASY</text>
    </g>

    <text x="832" y="356" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" fill="#4a3c32">EASE 2.5 → INTERVAL → NEXT DUE DATE</text>
  </g>
</svg>
