<svg width="804" height="740" viewBox="0 0 804 740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131f38"/>
      <stop offset="100%" stop-color="#0e2f34"/>
    </linearGradient>
    <linearGradient id="panel-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a08"/>
      <stop offset="100%" stop-color="#34260c"/>
    </linearGradient>
    <linearGradient id="panel-mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18220a"/>
      <stop offset="100%" stop-color="#22320f"/>
    </linearGradient>
    <linearGradient id="panel-azure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1c33"/>
      <stop offset="100%" stop-color="#131f38"/>
    </linearGradient>
  </defs>

  <style>
    .pn{animation:pn 16s ease-in-out infinite}
    .cite{animation:cite 16s ease-in-out infinite}
    .cur{animation:blink 1.4s steps(1) infinite}
    .press{animation:press 16s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pn{0%,25%,100%{stroke-width:2}6%,19%{stroke-width:3.5}}
    @keyframes cite{0%,16%,100%{stroke:#3b3028}3%,10%{stroke:#35d6e8}}
    @keyframes blink{50%{opacity:0}}
    @keyframes press{0%,60%,68%,100%{transform:none}64%{transform:scale(.94)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="804" height="740" fill="#1e1a17"/>

  <text x="24" y="35" font-family="'Courier New', monospace" font-size="12" letter-spacing="2"
        fill="#c4b5aa">A MOCKUP IN THE APP'S OWN DESIGN SYSTEM, NOT A SCREENSHOT</text>

  <!-- ===================== Panel 1: CHAT ===================== -->
  <g>
    <rect class="pn" style="animation-delay:0s" x="24" y="56" width="366" height="318" rx="10" fill="url(#panel-sky)" stroke="#35d6e8" stroke-width="2"/>
    <text x="44" y="87" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#92eaf4">CHAT — CITED BEFORE THE ANSWER</text>
    <!-- citation card -->
    <rect class="cite" x="44" y="102" width="326" height="52" rx="6" fill="#1e1a17" stroke="#3b3028"/>
    <rect x="58" y="113" width="6" height="30" fill="#35d6e8"/>
    <text x="76" y="124" font-family="'Courier New', monospace" font-size="12" fill="#92eaf4">physiology-wk6.pdf · p.31</text>
    <text x="76" y="142" font-family="'Courier New', monospace" font-size="12" fill="#c4b5aa">retrieved · 1 of 3</text>

    <!-- answer bubble -->
    <rect x="44" y="166" width="326" height="124" rx="6" fill="#262119" stroke="#3b3028"/>
    <text x="58" y="188" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">Because the two limbs do opposite</text>
    <text x="58" y="206" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">jobs — one sheds water, the other</text>
    <text x="58" y="224" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">pumps out salt. Stacked against each</text>
    <text x="58" y="242" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">other, they turn a small difference</text>
    <text x="58" y="260" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">into a steep one.</text>
    <rect class="cur" x="58" y="268" width="7" height="12" fill="#35d6e8"/>

    <!-- input row -->
    <rect x="44" y="302" width="326" height="30" rx="6" fill="#1e1a17" stroke="#3b3028"/>
    <text x="58" y="321" font-family="'Courier New', monospace" font-size="12" fill="#a89484">Ask about this subspace…</text>

    <text x="44" y="354" font-family="'Courier New', monospace" font-size="11.5" letter-spacing="1" fill="#a89484">SSE · TOKEN-BY-TOKEN · CITED FIRST</text>
  </g>

  <!-- ===================== Panel 2: NOTES ===================== -->
  <g>
    <rect class="pn" style="animation-delay:4s" x="414" y="56" width="366" height="318" rx="10" fill="url(#panel-sun)" stroke="#ffc53d" stroke-width="2"/>
    <text x="434" y="87" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#ffdd8f">NOTES — LATEX + AI, MARKED</text>
    <text x="434" y="116" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#f5ede4">Countercurrent Multiplication</text>
    <rect x="434" y="126" width="326" height="1" fill="#3b3028"/>
    <text x="434" y="150" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">The gradient forms because:</text>

    <!-- rendered math block -->
    <rect x="434" y="162" width="326" height="38" rx="4" fill="#1e1a17" stroke="#3b3028"/>
    <text x="448" y="186" font-family="'Courier New', monospace" font-style="italic" font-size="15" fill="#ffdd8f">∂L/∂w = 0</text>

    <!-- AI-touched paragraph, marked -->
    <rect x="434" y="214" width="4" height="66" fill="#ff5a3c"/>
    <text x="450" y="226" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">Descending: permeable to water,</text>
    <text x="450" y="243" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">not salt. Ascending: pumps salt</text>
    <text x="450" y="260" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">out, holds water.</text>
    <text x="450" y="278" font-family="'Courier New', monospace" font-size="12" fill="#ffb3a0">Created by AI · Edited by you</text>

    <!-- selection-action pills -->
    <g font-family="'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">
      <rect x="434" y="296" width="84" height="26" rx="5" fill="#1e1a17" stroke="#4a3c32"/>
      <text x="476" y="313" fill="#d3c5b9">REWRITE</text>
      <rect x="528" y="296" width="84" height="26" rx="5" fill="#1e1a17" stroke="#4a3c32"/>
      <text x="570" y="313" fill="#d3c5b9">SIMPLIFY</text>
      <rect x="622" y="296" width="84" height="26" rx="5" fill="#1e1a17" stroke="#4a3c32"/>
      <text x="664" y="313" fill="#d3c5b9">EXPLAIN</text>
    </g>

    <text x="434" y="354" font-family="'Courier New', monospace" font-size="11.5" letter-spacing="1" fill="#a89484">touched_by_agent · touched_by_user</text>
  </g>

  <g transform="translate(0 342)">
  <!-- ===================== Panel 3: FLASHCARDS ===================== -->
  <g>
    <rect class="pn" style="animation-delay:8s" x="24" y="56" width="366" height="318" rx="10" fill="url(#panel-mint)" stroke="#b8ff3c" stroke-width="2"/>
    <text x="44" y="87" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#d8ff92">FLASHCARDS — REAL FSRS SPACING</text>
    <rect x="44" y="102" width="326" height="158" rx="8" fill="#1e1a17" stroke="#3b3028"/>
    <text x="60" y="128" font-family="'Courier New', monospace" font-size="12" fill="#c4b5aa">CARD 2 OF 5 · P.31 · DUE TODAY</text>
    <text x="60" y="160" font-family="'Courier New', monospace" font-size="13" fill="#f5ede4">What does the ascending</text>
    <text x="60" y="179" font-family="'Courier New', monospace" font-size="13" fill="#f5ede4">limb of the loop do?</text>
    <rect x="60" y="198" width="294" height="1" fill="#3b3028"/>
    <text x="60" y="228" font-family="'Courier New', monospace" font-size="12" fill="#86e9c9">It pumps salt out and holds water in</text>

    <!-- grade buttons -->
    <g font-family="'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle">
      <g><rect x="44" y="278" width="74" height="34" rx="5" fill="#351122" stroke="#ff3d8b"/>
      <text x="81" y="299" fill="#ff9ac1">AGAIN</text></g>
      <g><rect x="128" y="278" width="74" height="34" rx="5" fill="#34260c" stroke="#ffc53d"/>
      <text x="165" y="299" fill="#ffdd8f">HARD</text></g>
      <g class="press"><rect x="212" y="278" width="74" height="34" rx="5" fill="#0e2f34" stroke="#35d6e8"/>
      <text x="249" y="299" fill="#92eaf4">GOOD</text></g>
      <g><rect x="296" y="278" width="74" height="34" rx="5" fill="#22320f" stroke="#b8ff3c"/>
      <text x="333" y="299" fill="#d8ff92">EASY</text></g>
    </g>

    <text x="44" y="354" font-family="'Courier New', monospace" font-size="11.5" letter-spacing="1" fill="#a89484">STABILITY → INTERVAL → NEXT DUE DATE</text>
  </g>

  <!-- ===================== Panel 4: STUDENT MODEL ===================== -->
  <g>
    <rect class="pn" style="animation-delay:12s" x="414" y="56" width="366" height="318" rx="10" fill="url(#panel-azure)" stroke="#5590ff" stroke-width="2"/>
    <text x="434" y="87" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#a6c6ff">STUDENT MODEL — FROM REAL SCORES</text>
    <!-- weak concept -->
    <rect x="434" y="102" width="326" height="76" rx="6" fill="#1e1a17" stroke="#ff3d8b"/>
    <text x="450" y="124" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#ff9ac1">WEAK CONCEPT</text>
    <text x="450" y="144" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">Countercurrent Multiplication</text>
    <text x="450" y="164" font-family="'Courier New', monospace" font-size="12" fill="#ff9ac1">2 of 5 recent questions right</text>

    <!-- improving concept -->
    <rect x="434" y="190" width="326" height="76" rx="6" fill="#1e1a17" stroke="#b8ff3c"/>
    <text x="450" y="212" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#d8ff92">IMPROVING</text>
    <text x="450" y="232" font-family="'Courier New', monospace" font-size="12" fill="#e0d3c8">Cellular Respiration</text>
    <text x="450" y="252" font-family="'Courier New', monospace" font-size="12" fill="#d8ff92">58% → 81% average</text>

    <!-- observed habit -->
    <text x="434" y="294" font-family="'Courier New', monospace" font-size="12" fill="#a9bde0">Observed: asks for a worked example</text>
    <text x="434" y="312" font-family="'Courier New', monospace" font-size="12" fill="#a9bde0">before the formal explanation.</text>

    <text x="434" y="354" font-family="'Courier New', monospace" font-size="11.5" letter-spacing="1" fill="#a89484">TOPICVIEW · CONCEPTVIEW · READ TIME</text>
  </g>
  </g>
</svg>
