<svg width="1200" height="10" viewBox="0 0 1200 10" xmlns="http://www.w3.org/2000/svg">
  <style>
    .run{animation:run 7s linear infinite}
    .dot{animation:dot 7s ease-out infinite}
    @keyframes run{0%{transform:translateX(-40px);opacity:0}5%{opacity:.9}60%{transform:translateX(1200px);opacity:.9}61%,100%{transform:translateX(1200px);opacity:0}}
    @keyframes dot{0%,100%{transform:none}3%{transform:scaleY(1.6)}8%{transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g fill="#3b3028">
    <rect x="0" y="4" width="1200" height="2"/>
  </g>
  <g>
    <rect class="dot" style="transform-box:fill-box;transform-origin:center;animation-delay:0.27s" x="40" y="2" width="20" height="6" fill="#ff5a3c"/>
    <rect class="dot" style="transform-box:fill-box;transform-origin:center;animation-delay:0.77s" x="188" y="2" width="20" height="6" fill="#35d6e8"/>
    <rect class="dot" style="transform-box:fill-box;transform-origin:center;animation-delay:1.27s" x="336" y="2" width="20" height="6" fill="#b8ff3c"/>
    <rect class="dot" style="transform-box:fill-box;transform-origin:center;animation-delay:1.77s" x="484" y="2" width="20" height="6" fill="#ffc53d"/>
    <rect class="dot" style="transform-box:fill-box;transform-origin:center;animation-delay:2.28s" x="632" y="2" width="20" height="6" fill="#ff3d8b"/>
    <rect class="dot" style="transform-box:fill-box;transform-origin:center;animation-delay:2.78s" x="780" y="2" width="20" height="6" fill="#5590ff"/>
    <rect class="dot" style="transform-box:fill-box;transform-origin:center;animation-delay:3.28s" x="928" y="2" width="20" height="6" fill="#22d3a0"/>
  </g>
  <rect class="run" x="0" y="4" width="28" height="2" fill="#fff6ea" opacity="0"/>
</svg>
