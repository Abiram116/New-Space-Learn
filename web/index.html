<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1A17" />
    <!--
      Warm the two origins every signed-in load talks to, before any JavaScript
      has parsed.

      A cold request to a new origin pays DNS + TCP + TLS before a single byte
      of the response moves — on a mobile connection that is comfortably 200ms,
      and it is paid twice here because Supabase (auth) and the API (data) are
      different hosts. `preconnect` does that handshake during HTML parse, in
      parallel with downloading the bundle, so the first real request starts on
      an open connection.

      Injected at build time from the same env vars the client reads, because a
      hardcoded host here would silently stop helping the moment either moved
      and nothing would fail loudly enough to notice.
    -->
    %VITE_PRECONNECT%
    <!--
      Fonts are served from this origin, not Google's.

      The Google Fonts stylesheet was render-blocking and cross-origin: the browser had
      to open a connection to fonts.googleapis.com, download the CSS, and only then learn
      the file URLs on a second host (fonts.gstatic.com) and open a connection to that
      too, before any text could be drawn in the right face — three round trips on a
      phone, ahead of the boot splash. Here the same files (the identical variable woff2
      Google serves, latin and latin-ext) are declared inline, so there is no stylesheet to
      wait for, and the two faces the first screen needs are preloaded in parallel with the
      entry bundle. `font-display: swap` is unchanged. The Cyrillic, Greek and Vietnamese
      subsets Google would also have offered are left out; text in them uses the system face.
      `preload` needs `crossorigin` even same-origin: fonts are fetched in anonymous CORS
      mode and a mismatch makes the browser download the file twice.
    -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* latin-ext */
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 500 800;
        font-stretch: 100% 112%;
        font-display: swap;
        src: url('/fonts/archivo-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* latin */
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 500 800;
        font-stretch: 100% 112%;
        font-display: swap;
        src: url('/fonts/archivo-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* latin-ext */
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* latin */
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* latin-ext */
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/manrope-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* latin */
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/manrope-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <title>Space Learn</title>
    <meta
      name="description"
      content="Upload your own notes or PDFs and get answers that cite the exact page they came from, then turn them into notes, flashcards and quizzes."
    />
    <!--
      Link previews (WhatsApp, Slack, X, LinkedIn, Discord, iMessage).

      Crawlers read this static HTML and never run the app's JavaScript, so
      these tags have to live here rather than be set from React. URLs must be
      absolute for the same reason. When the site moves to its own domain,
      change SITE below in all places — here, public/robots.txt and
      public/sitemap.xml — and nowhere else.

      og-image-v2.jpg is 1200x630 (the 1.91:1 every platform crops to) and well
      under WhatsApp's ~300 KB limit; a JPG because some crawlers ignore WebP
      and SVG, and a BASELINE one: WhatsApp drops the preview for a progressive
      JPEG while Telegram, Instagram and Google Messages show it. The -v2 is
      because WhatsApp remembers a failed preview per image URL; an unchanged
      name would keep showing nothing. (tests/seo.test.ts checks both.)
    -->
    <link rel="canonical" href="https://new-space-learn.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Space Learn" />
    <meta property="og:title" content="Space Learn" />
    <meta
      property="og:description"
      content="Upload your own notes or PDFs and get answers that cite the exact page they came from, then turn them into notes, flashcards and quizzes."
    />
    <meta property="og:url" content="https://new-space-learn.vercel.app/" />
    <meta property="og:image" content="https://new-space-learn.vercel.app/og-image-v2.jpg" />
    <meta property="og:image:secure_url" content="https://new-space-learn.vercel.app/og-image-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Space Learn: a student reading a book beside the Space Learn name" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Space Learn" />
    <meta
      name="twitter:description"
      content="Upload your own notes or PDFs and get answers that cite the exact page they came from, then turn them into notes, flashcards and quizzes."
    />
    <meta name="twitter:image" content="https://new-space-learn.vercel.app/og-image-v2.jpg" />
    <meta name="twitter:image:alt" content="Space Learn: a student reading a book beside the Space Learn name" />
  </head>
  <body>
    <!--
      THESIS: A student's own material, handled as evidence. Every answer keeps
      the page it came from, and the page becomes the thing you're tested on.
      Refuses the warm rounded consumer-app card surface every study tool ships,
      and its opposite, the austere neutral dark dashboard.
      OWN-WORLD: A dark drafting table under a lamp. Warm graphite ground
      (#1E1A17), never black, ruled with a faint graticule; blueprint cyan for
      sources, amber for recall, magenta for scoring, vermilion for the live
      action; no violet. Archivo in wide heavy caps for nameplates, Manrope
      body, JetBrains Mono for every citation, page number, count and unit —
      evidence should read as a record, not a caption.
      MATERIALS: three, and the material tells you what kind of thing it is.
      Cardstock is a thing you have; a leaf is a thing you're inside; a ledger
      is a thing you're measured against.
      STORY: A student returning after days away is told where they stood and
      what to play next, then turns a conversation into cards they'll be tested on.
      FIRST VIEWPORT: Rail of subject sets at left; a personal re-entry brief in
      display caps across the top; due-work as face-up cards beneath it, the
      primary action on the card that is actually due.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <!--
      BOOT SPLASH — inline on purpose.

      `#root` was empty, so between the browser parsing this file and React
      mounting there was nothing to paint: a blank page for however long the
      entry chunk, the fonts and the auth round-trip take. On a phone on
      college wifi that is comfortably over a second of white-then-dark flash.

      Everything below is inline — no stylesheet, no script, no image request —
      so it paints on the very first frame, before a single asset has landed.
      Anything external would defeat the point by being the thing we are
      waiting for.

      It is removed by `hideBootSplash()` once auth has resolved, not merely
      when JS runs: routing depends on knowing whether there is a session, and
      tearing this down earlier would show a frame of the signed-out layout to
      someone who is signed in. See `src/lib/bootSplash.ts`.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #1e1a17;
        /* The drafting graticule the whole product is built on, so the first
           thing on screen already belongs to the app rather than being a
           generic loader that gets replaced by something unrelated. */
        background-image:
          linear-gradient(to right, rgba(245, 237, 228, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(245, 237, 228, 0.035) 1px, transparent 1px);
        background-size: 22px 22px;
        transition: opacity 420ms ease, visibility 420ms;
      }
      #boot[data-hidden='true'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      /* No standalone mark above the wordmark any more — two earlier
         passes here (a card deal, then a four-corner viewfinder) both got
         replaced for the same underlying reason: this is a product for
         students, and both read as borrowed objects (a card trick, a
         camera or gun sight) rather than the product's own. What's left
         below draws the loading state entirely out of the pencil that
         also IS the live cursor (`DraftingCursor.tsx`) — the ruled
         progress line is the page, and a nib actually drawing it is the
         one mark this screen needs. */
      #boot .boot-word {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9c8b80;
      }
      /* A ruled progress line rather than a spinner: a spinner says "busy",
         a filling rule says "getting there", and this is a finite wait.
         The tick marks are new — a plain flat track read as generic; a
         ruled one ties the bar to the same drafting-instrument vocabulary
         as the mark above it instead of sitting next to it unrelated. */
      #boot .boot-rule {
        width: 132px;
        height: 3px;
        border-radius: 1px;
        background:
          repeating-linear-gradient(
            to right,
            rgba(245, 237, 228, 0.22) 0,
            rgba(245, 237, 228, 0.22) 1px,
            transparent 1px,
            transparent 11px
          ),
          #2a2119;
        overflow: hidden;
      }
      /* The fill is a wedge, not a rectangle: `clip-path` tapers its
         leading edge to a point, so the shape reading the sweep is a
         chisel-tip nib actually drawing the rule as it travels rather
         than a generic bar scanning across it. Same element the old
         rectangular fill was — nothing new to clip against `.boot-rule`'s
         own `overflow: hidden`, which still has to stay so the sweep can
         run past both ends without a visible bar hanging off them. */
      #boot .boot-rule span {
        display: block;
        height: 100%;
        width: 40%;
        background: #ff5a3c;
        clip-path: polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%);
        animation: bootSweep 1.35s ease-in-out infinite;
      }
      @keyframes bootSweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-rule span {
          animation: none;
          width: 100%;
          clip-path: none;
        }
      }
    </style>
    <div id="boot" role="status" aria-live="polite" aria-label="Loading Space Learn">
      <div class="boot-inner">
        <div class="boot-word">Space Learn</div>
        <div class="boot-rule"><span></span></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
