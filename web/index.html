    <!--
      THESIS: A student's own material, handled as evidence. Every answer keeps
      the page it came from, and the page becomes the thing you're tested on.
      Refuses the warm rounded consumer-app card surface every study tool ships,
      and its opposite, the austere neutral dark dashboard.
      OWN-WORLD: A dark drafting table under a lamp. Warm graphite ground
      (#1E1A17), never black, ruled with a faint graticule; blueprint cyan for
      sources, amber for recall, magenta for scoring, vermilion for the live
      action; no violet. Archivo in wide heavy caps for nameplates, Manrope
      body, JetBrains Mono for every citation, page number, count and unit —
      evidence should read as a record, not a caption.
      MATERIALS: three, and the material tells you what kind of thing it is.
      Cardstock is a thing you have; a leaf is a thing you're inside; a ledger
      is a thing you're measured against.
      STORY: A student returning after days away is told where they stood and
      what to play next, then turns a conversation into cards they'll be tested on.
      FIRST VIEWPORT: Rail of subject sets at left; a personal re-entry brief in
      display caps across the top; due-work as face-up cards beneath it, the
      primary action on the card that is actually due.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
