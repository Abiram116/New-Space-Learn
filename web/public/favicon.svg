<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Space Learn: three cards fanned from one corner, matching LogoMark.
       Drawn on its own dark tile so the mark stays legible against light
       browser chrome as well as dark. -->
  <rect width="32" height="32" rx="7" fill="#1E1815"/>
  <g transform="translate(0.5 1)">
    <rect x="4.2" y="9.6" width="12.6" height="17" rx="2.4"
          transform="rotate(-19 4.2 9.6)"
          fill="#2EE6D6" fill-opacity="0.34"
          stroke="#2EE6D6" stroke-opacity="0.6" stroke-width="1.1"/>
    <rect x="9.4" y="6.8" width="12.6" height="17" rx="2.4"
          transform="rotate(-8 9.4 6.8)"
          fill="#FFC53D" fill-opacity="0.36"
          stroke="#FFC53D" stroke-opacity="0.65" stroke-width="1.1"/>
    <rect x="13.6" y="5.4" width="12.6" height="17.6" rx="2.6"
          transform="rotate(4 13.6 5.4)"
          fill="#FF5A3C" stroke="#FF8B76" stroke-width="1.1"/>
    <path d="M17.4 12h6M17.4 15.1h3.9"
          transform="rotate(4 13.6 5.4)"
          stroke="#1A120F" stroke-opacity="0.6" stroke-width="1.6"
          stroke-linecap="round"/>
  </g>
</svg>
