[project]
name = "space-learn-api"
version = "0.1.0"
description = "Space Learn — FastAPI backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.32,<0.36",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<0.29",
  "python-multipart>=0.0.12,<0.1",
  "python-jose[cryptography]>=3.3,<4",
  "pypdf>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.26",
  "anyio>=4.4,<5",
  "ruff>=0.7,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
