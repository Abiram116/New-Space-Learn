# Keep the free-tier backend warm, so a student never meets a cold start.
#
# Render free spins a service down after 15 minutes without traffic, and waking
# it costs ~30s+ before the first byte — the single worst latency in the whole
# product, paid by exactly the student who shows up after a quiet stretch.
# A ping every 10 minutes keeps it inside that window. One service up 24/7 is
# ~720 instance-hours a month, inside Render's 750 free.
#
# It pings /ready, not /health: /ready does a real (tiny) database read, which
# ALSO keeps a free Supabase project from auto-pausing after a week idle. A
# paused Supabase project does not wake on request — it needs a manual restore
# from the dashboard — so this is the only thing standing between "the app is
# quiet for a week" and "the app is down until someone notices".
#
# Setup: repo Settings → Secrets and variables → Actions → Variables →
#   BACKEND_URL = https://<your-service>.onrender.com   (no trailing slash)
#
# Caveats worth knowing:
#   - GitHub's cron is best-effort; runs can slip by several minutes under load.
#     10 minutes leaves slack against the 15-minute spin-down.
#   - GitHub disables scheduled workflows in a repo with no commits for 60 days.
#     If the app ever cold-starts after a long quiet spell, check this first.

name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /ready
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL repo variable is not set; nothing to ping."
            exit 0
          fi
          # A cold instance can take ~60s to answer; retry rather than fail on
          # the one run that happened to catch it asleep.
          curl --fail --silent --show-error --max-time 90 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               "$BACKEND_URL/api/v1/ready"
