# Space Learn — Supabase project config.
# This file is what `supabase link` reads; the dashboard-linked GitHub
# integration watches migrations/*.sql regardless of this file.

project_id = "space-learn"

[db]
major_version = 15

[auth]
enable_signup = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
]

[auth.external.google]
enabled = true
# The real values live in the Supabase dashboard (Authentication →
# Providers → Google), not here — this file is committed to the repo.
# `env(...)` is the CLI's own convention for keeping secrets out of
# config.toml while still satisfying its schema, which validates this
# section even for commands that have nothing to do with auth (e.g.
# `migration list`). Point both at names that don't need to resolve to
# anything real for db-only commands to work.
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[storage]
enabled = true
file_size_limit = "50MiB"
